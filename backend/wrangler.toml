name = "gigsy-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Run once to provision (or `scripts/setup-secrets.ps1 -Provision`),
# then paste the D1 ID in below:
#   wrangler d1 create gigsy-db
#   wrangler r2 bucket create gigsy-receipts

[[d1_databases]]
binding = "DB"
database_name = "gigsy-db"
database_id = "c835bca1-4691-4651-8ac1-91de4d6ca458"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "gigsy-receipts"

# Calendar sync fan-out (docs/plan.md §9): every 15 min the
# scheduled() handler reconciles confirmed gigs onto connected users'
# Google Calendars.
[triggers]
crons = ["*/15 * * * *"]

[vars]
# What `wrangler deploy` ships. Local dev overrides this via
# .dev.vars (gitignored — copy .dev.vars.example); tests pin their
# own value in vitest.config.ts miniflare bindings.
ENVIRONMENT = "production"
# Public OAuth client ID (not a secret — it ships to the browser).
# Create at https://console.cloud.google.com/apis/credentials with the
# Calendar API enabled; paste the "Web application" client ID here.
GOOGLE_CLIENT_ID = "340454994892-ga0f49ndb2oj6pnrmp5881it6cggjnsn.apps.googleusercontent.com"
# AI extraction provider selection (docs/plan.md §8). Deliberately
# config, not code — swap provider/model without touching call sites.
AI_PROVIDER = "gemini"
AI_MODEL = "gemini-2.5-flash"
# Cost control (docs/plan.md §8): AI captures per user per UTC day.
AI_DAILY_CAP = "50"
# Domain for per-user capture addresses (u-<userId>@<domain>). Empty
# disables email capture, and the Settings screen says so rather than
# showing an address that would bounce. Turning it on also needs
# Cloudflare Email Routing on this domain with a catch-all rule
# pointing at this Worker — see the Phase plan.
CAPTURE_EMAIL_DOMAIN = ""
# ALLOWED_EMAILS deliberately does NOT live here. It is a secret — see
# the secrets block below — because this repository is public and the
# list is other people's email addresses. A var would publish them, and
# git history does not forget.
#
# It used to be `ALLOWED_EMAILS = ""` in this block, which is why the
# line is called out rather than simply deleted. The two cannot coexist:
# Cloudflare refuses to create a secret while a var of that name is
# bound —
#   Binding name 'ALLOWED_EMAILS' already in use  [code: 10053]
# — so re-adding it here does not merely duplicate the setting, it makes
# the allowlist impossible to set until the line is removed and the
# Worker redeployed. Meanwhile the var's own value is what applies, and
# an empty allowlist means ANYONE with a Google account can sign in.

# Web Push (Phase 10). The PUBLIC half of the VAPID pair — public by
# definition, since the browser needs it to subscribe. Mint the pair
# with scripts/setup-secrets.ps1 (GENERATE_VAPID); it stores the
# private half as a worker secret and prints this one. Push stays off
# while this is empty, and the UI says so rather than failing at the
# permission prompt.
VAPID_PUBLIC_KEY = "BChOgtoYJF0huIquThGFdr052Hb8Ey5Zu1qLQPjB9afaPHgXnj5BeQNFmDB0T_vqOfG49K8YTC0HU0l4LF7OWIA"
# Contact a push service can use to reach the sender (RFC 8292).
PUSH_SUBJECT = "mailto:noreply@gigsy.app"
# Sender address for "Send feedback" mail (docs/superpowers/specs/
# 2026-10-11-feedback-design.md). Empty means mail is not configured:
# every feedback is still stored, with email_status = unsent, and the
# user is told it was saved. Set it to an address on a domain onboarded
# for Cloudflare Email Sending — the platform refuses any other sender
# — at the same time as enabling the [[send_email]] block below.
FEEDBACK_FROM = ""
# ADMIN_EMAILS (who receives feedback mail) is a SECRET, not a var, on
# exactly the terms ALLOWED_EMAILS is above: the list is other people's
# addresses in a public repository, and a var of the same name would
# block `wrangler secret put` with error 10053. See the secrets block.
# Secrets — set via `wrangler secret put` (bootstrap with
# scripts/setup-secrets.ps1 -Cloudflare). Full matrix: docs/plan.md §11.
#   AUTH_SECRET             — HS256 JWT signing key
#   REFRESH_TOKEN_ENC_KEY   — AES-GCM key for users.google_refresh_token_enc
#   GOOGLE_CLIENT_SECRET    — OAuth code -> refresh token exchange
#   GEMINI_API_KEY          — primary extraction provider
#   ANTHROPIC_API_KEY       — optional fallback provider
#   ALLOWED_EMAILS          — comma-separated list of who may sign in.
#                             A secret not because it is confidential but
#                             because it is personal data in a public
#                             repo. Unset or empty means ANYONE with a
#                             Google account, which is only safe while
#                             the OAuth consent screen sits in Testing
#                             mode. Add a tester with:
#                               wrangler secret put ALLOWED_EMAILS
#                             and paste the whole list — it replaces
#                             rather than appends. Keep your own address
#                             in it; a list without you locks you out.
#   ADMIN_EMAILS            — comma-separated list of who receives
#                             "Send feedback" mail. A secret for the
#                             same reason as ALLOWED_EMAILS. Unset or
#                             empty means feedback is stored `unsent`
#                             and nobody is mailed. Set with:
#                               wrangler secret put ADMIN_EMAILS

# Email Sending for feedback mail — DELIBERATELY COMMENTED OUT.
#
# A [[send_email]] binding on an account with no onboarded Email Sending
# domain is refused at deploy time, and this repository deploys on every
# merge: an unconditional block here would break every deploy until the
# domain exists. src/env.ts types EMAIL as optional for the same reason,
# and until it is bound every feedback row reads email_status = unsent.
#
# Enable it ("Turn it on" in the feedback design doc) once:
#   1. a sending domain is onboarded in the Cloudflare dashboard
#      (Compute -> Email Service -> Email Sending);
#   2. ADMIN_EMAILS is set as a secret (above);
#   3. FEEDBACK_FROM above is an address on that domain.
# Then uncomment these two lines, deploy, send one feedback with an
# image, and confirm every admin inbox receives it with the attachment.
#
# [[send_email]]
# name = "EMAIL"

[observability]
enabled = true
