<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <!-- iOS ignores the manifest icons array — it wants this link. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!-- iOS PWA polish: hide the Safari chrome and make the status
         bar transparent when launched from the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gigsy" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <!--
      Applied before first paint, deliberately synchronous: a classic
      <script src> here blocks parsing, so React state — which resolves
      too late and gave a white flash on every launch, worst on the
      installed PWA — never gets the first word.

      A FILE, not an inline script. Production's Content-Security-Policy
      (functions/_middleware.ts) is `script-src 'self'` with no inline
      allowance, so the inline version that used to sit here was blocked
      on every cold start of the deployed app: the theme reverted to
      light until Settings was opened, and iOS painted a light status
      bar over a dark app. `vite dev` serves no CSP, which is why it
      looked fine locally. src/lib/index-html.test.ts keeps this page
      free of inline scripts for that reason; src/lib/theme-boot.test.ts
      runs the file itself against the module's cases.
    -->
    <script src="/theme-boot.js"></script>
    <title>Gigsy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
