<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <!-- iOS ignores the manifest icons array — it wants this link. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!-- iOS PWA polish: hide the Safari chrome and make the status
         bar transparent when launched from the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gigsy" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <!--
      Applied before first paint, deliberately inline and synchronous.
      React state resolves too late: the user gets a white flash on every
      launch, worst on the installed PWA, which is the primary surface.

      Kept minimal and duplicated from src/lib/theme.ts on purpose —
      importing a module here would defeat the point by making it async.
      src/lib/theme.test.ts pins the same rules.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("gigsy:theme");
          var choice =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          var dark =
            choice === "dark" ||
            (choice === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light",
          );
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0f172a" : "#f8fafc");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <title>Gigsy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
